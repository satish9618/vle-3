name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:

  # ============================================================
  # JOB 1: LINT
  # ============================================================
  lint:
    name: Code Quality - Oxlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint


  # ============================================================
  # JOB 2: BUILD
  # ============================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest

    # Build starts only if lint succeeds
    needs:
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Save the generated dist/ directory
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/